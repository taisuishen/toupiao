<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>匿名意见反馈</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
    --line: #e4e2dc; --accent: #2f6f5e; --accent-soft: #e3efe9; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --card: #1e1e1e; --text: #f2f2f2; --muted: #a0a0a5;
      --line: #333; --accent: #6cc3a7; --accent-soft: #23362f; --danger: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 15px; font-weight: 600; color: var(--muted); margin: 0 0 6px; letter-spacing: .02em; }
  h2 { font-size: 24px; line-height: 1.35; margin: 0 0 8px; }
  .desc { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .opt {
    display: flex; align-items: center; gap: 12px; padding: 13px 14px; margin-bottom: 10px;
    border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .opt:hover { border-color: var(--accent); }
  .opt input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }
  .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  textarea {
    width: 100%; min-height: 110px; resize: vertical; margin-top: 6px; padding: 12px;
    border: 1.5px solid var(--line); border-radius: 10px; background: transparent; color: inherit; font: inherit;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .count { text-align: right; font-size: 12px; color: var(--muted); }
  button {
    width: 100%; margin-top: 16px; padding: 13px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button { color: #0e1f19; } }
  button:disabled { opacity: .5; cursor: default; }
  .link { background: none; color: var(--accent); width: auto; padding: 0; margin: 14px 0 0; font-weight: 500; }
  .err { color: var(--danger); font-size: 14px; min-height: 1.4em; margin: 10px 0 0; }
  .thanks { text-align: center; padding: 28px 20px; }
  .thanks b { display: block; font-size: 20px; margin-bottom: 4px; }
  .bar-row { margin-bottom: 14px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
  .bar-label span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 5px; transition: width .6s ease; }
  .section-title { font-size: 14px; font-weight: 600; color: var(--muted); margin: 28px 0 10px; }
  .comment { padding: 14px 0; border-top: 1px solid var(--line); white-space: pre-wrap; word-break: break-word; }
  .comment:first-child { border-top: 0; padding-top: 0; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .tag { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 6px; margin-right: 6px; }
  .thanks .link { display: block; margin: 12px auto 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <h2 id="question">加载中…</h2>
  <p class="desc" id="desc"></p>

  <form id="form" class="card hidden">
    <div id="options"></div>
    <div id="comment-wrap" class="hidden">
      <textarea id="comment" maxlength="500"></textarea>
      <div class="count"><span id="count">0</span> / 500</div>
    </div>
    <button type="submit" id="submit">匿名提交</button>
    <p class="err" id="err"></p>
  </form>

  <div id="thanks" class="card thanks hidden">
    <b>感谢你的反馈 🙌</b>
    <span class="desc">你的意见已匿名保存。</span>
    <button class="link hidden" id="again" type="button">再写一条 →</button>
  </div>

  <div id="results" class="hidden">
    <div class="section-title" id="total"></div>
    <div class="card" id="bars"></div>
    <div id="comments-section" class="hidden">
      <div class="section-title" id="comments-title"></div>
      <div class="card" id="comments"></div>
    </div>
  </div>
  <button class="link hidden" id="show-results" type="button">看看大家的意见 →</button>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const key = new URLSearchParams(location.search).get('key');
  const api = '/api/poll' + (key ? '?key=' + encodeURIComponent(key) : '');
  let poll, latest;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  function el(tag, props = {}, children = []) {
    const n = Object.assign(document.createElement(tag), props);
    n.append(...children);
    return n;
  }

  function renderResults(results) {
    if (!results) return;
    const counts = poll.options.map((o) => Number(results.votes[o] || 0));
    const total = counts.reduce((a, b) => a + b, 0);
    $('bars').replaceChildren();
    if (poll.options.length) {
      $('total').textContent = `投票结果 · 共 ${total} 票`;
      poll.options.forEach((o, i) => {
        const pct = total ? Math.round((counts[i] / total) * 100) : 0;
        const fill = el('i', { style: 'width:0' });
        $('bars').append(el('div', { className: 'bar-row' }, [
          el('div', { className: 'bar-label' }, [el('span', { textContent: o }), el('span', { textContent: `${counts[i]} 票 · ${pct}%` })]),
          el('div', { className: 'bar' }, [fill]),
        ]));
        requestAnimationFrame(() => requestAnimationFrame(() => (fill.style.width = pct + '%')));
      });
    } else {
      $('total').classList.add('hidden');
      $('bars').classList.add('hidden');
    }

    const list = results.comments || [];
    $('comments-section').classList.toggle('hidden', !list.length);
    $('comments-title').textContent = `大家的意见 · ${list.length} 条`;
    $('comments').replaceChildren(...list.map((c) => el('div', { className: 'comment' }, [
      el('div', { textContent: c.text }),
      el('div', { className: 'meta' }, [
        ...(c.option ? [el('span', { className: 'tag', textContent: c.option })] : []),
        el('span', { textContent: c.date || '' }),
      ]),
    ])));
    $('results').classList.remove('hidden');
    $('show-results').classList.add('hidden');
  }

  async function load() {
    try {
      const res = await fetch(api);
      const data = await res.json();
      poll = data.poll;
      latest = data.results;
    } catch {
      $('question').textContent = '加载失败，请刷新重试';
      return;
    }
    document.title = poll.title;
    $('title').textContent = poll.title;
    $('question').textContent = poll.question;
    $('desc').textContent = poll.description || '';

    $('options').replaceChildren(...poll.options.map((o) =>
      el('label', { className: 'opt' }, [el('input', { type: 'radio', name: 'option', value: o }), el('span', { textContent: o })])
    ));
    if (poll.allowComment) {
      $('comment-wrap').classList.remove('hidden');
      $('comment').placeholder = poll.commentPlaceholder || '';
    }

    // Pure feedback mode allows multiple submissions; only votes are one-per-browser.
    if (poll.options.length && store.get('voted:' + poll.id)) {
      $('thanks').classList.remove('hidden');
      renderResults(latest);
    } else {
      $('form').classList.remove('hidden');
      if (latest) $('show-results').classList.remove('hidden');
    }
  }

  $('comment').addEventListener('input', (e) => ($('count').textContent = e.target.value.length));
  $('show-results').addEventListener('click', () => renderResults(latest));
  $('again').addEventListener('click', () => {
    $('comment').value = '';
    $('count').textContent = '0';
    $('submit').disabled = false;
    $('thanks').classList.add('hidden');
    $('form').classList.remove('hidden');
    $('comment').focus();
  });

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const option = $('form').querySelector('input[name=option]:checked')?.value || '';
    const comment = $('comment').value.trim();
    $('err').textContent = '';
    if (poll.options.length && !option) return ($('err').textContent = '请选择一个选项');
    if (!poll.options.length && !comment) return ($('err').textContent = '请填写意见');

    $('submit').disabled = true;
    try {
      const res = await fetch(api, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ option, comment }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '提交失败');
      if (poll.options.length) store.set('voted:' + poll.id, '1');
      $('form').classList.add('hidden');
      $('thanks').classList.remove('hidden');
      $('again').classList.toggle('hidden', poll.options.length > 0);
      latest = data.results;
      renderResults(latest);
    } catch (err) {
      $('err').textContent = err.message || '网络错误，请重试';
      $('submit').disabled = false;
    }
  });

  load();
</script>
</body>
</html>
